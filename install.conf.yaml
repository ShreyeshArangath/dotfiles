- defaults:
    link:
      relink: true
      create: true

- create:
    - ~/.zsh
    - ~/.cache

- link:
    ~/.zshrc: zsh/.zshrc
    ~/.zprofile: zsh/.zprofile
    ~/.profile: zsh/.profile
    ~/.p10k.zsh: zsh/.p10k.zsh
    ~/.gitconfig: git/.gitconfig
    ~/.config/git/ignore: git/ignore
    ~/.tmux.conf: tmux/.tmux.conf
    ~/.config/nvim: nvim
    ~/.ideavimrc: ideavim/.ideavimrc
    ~/.config/herdr/config.toml: herdr/config.toml
    ~/.config/herdr/sounds/silent.mp3: herdr/sounds/silent.mp3
    ~/.config/ghostty/config: ghostty/config
    ~/Library/Application Support/com.mitchellh.ghostty/config:
      path: ghostty/config
      if: '[ "$(uname -s)" = Darwin ]'
    ~/.config/karabiner/karabiner.json:
      path: karabiner/karabiner.json
      if: '[ "$(uname -s)" = Darwin ]'

    # Shared instructions; Copilot is opt-in.
    ~/.claude/CLAUDE.md: claude/AGENTS.md
    ~/.copilot/copilot-instructions.md:
      path: claude/AGENTS.md
      if: '[ "${DOTFILES_WITH_COPILOT:-0}" = 1 ]'

    # Claude Code - personal skills and hooks
    ~/.claude/skills/code-review: claude/skills/code-review
    ~/.claude/skills/worktree-manager: claude/skills/worktree-manager
    ~/.claude/hooks/notify-on-stop.py: claude/hooks/notify-on-stop.py
    ~/.claude/claude-logo.png: claude/claude-logo.png

    ~/.copilot/skills/humanizer:
      path: copilot/skills/humanizer
      if: '[ "${DOTFILES_WITH_COPILOT:-0}" = 1 ]'
    # url-forwarder - VM browser auth via SSH reverse tunnel (see url-forwarder/README.md)
    ~/.local/bin/url-listener:           url-forwarder/bin/url-listener
    ~/.local/bin/url-forwarder-register: url-forwarder/bin/url-forwarder-register
    ~/.local/bin/open-on-host:           url-forwarder/bin/open-on-host
    ~/.local/bin/xdg-open:               url-forwarder/bin/xdg-open

- shell:
    - description: Installing platform-specific packages
      command: |
        OS="$(uname -s)"
        case "${OS}" in
          Darwin*)
            # macOS - use Homebrew
            if command -v brew >/dev/null 2>&1; then
              echo "Installing packages from Brewfile..."
              brew bundle --file=Brewfile
            else
              echo "Homebrew not found. Skipping macOS package installation."
            fi
            ;;
          Linux*)
            # Linux - packages should already be installed by bootstrap.sh
            echo "Linux detected. Essential packages installed by bootstrap.sh"
            ;;
          *)
            echo "Unknown OS. Skipping package installation."
            ;;
        esac
      stdout: true
      stderr: true

    - description: Installing Powerlevel10k
      command: |
        if [ ! -d "$HOME/.powerlevel10k" ]; then
          echo "Installing Powerlevel10k..."
          git clone --depth=1 https://github.com/romkatv/powerlevel10k.git ~/.powerlevel10k
        else
          echo "Powerlevel10k already installed"
        fi
      stdout: true
      stderr: true

    - description: Installing zsh-autosuggestions
      command: |
        PLUGIN_DIR="$HOME/.zsh/zsh-autosuggestions"
        if [ ! -d "$PLUGIN_DIR" ]; then
          echo "Installing zsh-autosuggestions..."
          git clone https://github.com/zsh-users/zsh-autosuggestions "$PLUGIN_DIR"
        else
          echo "zsh-autosuggestions already installed"
        fi
      stdout: true
      stderr: true

    - description: Installing zsh-syntax-highlighting
      command: |
        PLUGIN_DIR="$HOME/.zsh/zsh-syntax-highlighting"
        if [ ! -d "$PLUGIN_DIR" ]; then
          echo "Installing zsh-syntax-highlighting..."
          git clone https://github.com/zsh-users/zsh-syntax-highlighting "$PLUGIN_DIR"
        else
          echo "zsh-syntax-highlighting already installed"
        fi
      stdout: true
      stderr: true

    - description: Installing Tmux Plugin Manager (TPM)
      command: |
        set -e
        if [ ! -d "$HOME/.tmux/plugins/tpm" ]; then
          echo "Installing Tmux Plugin Manager..."
          git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"
          echo "TPM installed successfully"
        else
          echo "TPM already installed"
        fi
      stdout: true
      stderr: true

    - description: Installing Tmux plugins
      command: |
        set -e
        echo "Installing tmux plugins..."
        if [ -f "$HOME/.tmux/plugins/tpm/bin/install_plugins" ]; then
          # Set TMUX_PLUGIN_MANAGER_PATH for TPM
          export TMUX_PLUGIN_MANAGER_PATH="$HOME/.tmux/plugins"

          # Run TPM's install script
          bash "$HOME/.tmux/plugins/tpm/bin/install_plugins"

          for plugin in tmux tmux-yank tmux-resurrect tmux-continuum; do
            if [ ! -d "$HOME/.tmux/plugins/$plugin" ]; then
              echo "Error: tmux plugin missing after installation: $plugin" >&2
              exit 1
            fi
            echo "$plugin installed successfully"
          done
        else
          echo "Error: TPM installer not found. Check ~/.tmux/plugins/tpm." >&2
          exit 1
        fi
      stdout: true
      stderr: true
